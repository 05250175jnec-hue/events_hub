<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>JNEC Events Hub — Register</title> 
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head> 
<body> 

  <!-- G5 Bootstrap Responsive Navbar -->
  <header id="top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="fa-solid fa-graduation-cap text-primary me-2"></i>JNEC Events Hub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="events.html">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="register.html">Register</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header> 

  <main> 
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center">
              <i class="fa-solid fa-user-plus text-primary me-2"></i>Event Registration
            </h2>

            <form action="#" method="post" enctype="multipart/form-data" id="regForm"> 
              
              <!-- Personal Details -->
              <fieldset class="border rounded p-3 mb-4"> 
                <legend class="float-none w-auto px-2 h6 fw-bold text-primary">
                  <i class="fa-solid fa-user me-1"></i> Personal Details
                </legend> 
                
                <div class="mb-3">
                  <label for="fullname" class="form-label">Full name</label> 
                  <input type="text" id="fullname" name="fullname" class="form-control" required> 
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label> 
                  <input type="email" id="email" name="email" class="form-control" placeholder="student@jnec.edu.bt" required> 
                </div>

                <div class="mb-3">
                  <label for="phone" class="form-label">Phone</label> 
                  <input type="tel" id="phone" name="phone" class="form-control"> 
                </div>
              </fieldset> 

              <!-- Event Choice -->
              <fieldset class="border rounded p-3 mb-4"> 
                <legend class="float-none w-auto px-2 h6 fw-bold text-primary">
                  <i class="fa-solid fa-calendar-check me-1"></i> Event Choice
                </legend> 
                
                <div class="mb-3">
                  <label for="event_id" class="form-label">Event</label> 
                  <select id="event_id" name="event_id" class="form-select" required> 
                    <option value="">-- choose an event --</option> 
                    <option value="1">Tech Week Hackathon</option> 
                    <option value="2">Losar Festival Night</option> 
                    <option value="3">Inter-College Football</option> 
                    <option value="4">Robotics Exhibition</option> 
                  </select> 
                </div>

                <div class="mb-3">
                  <label class="form-label d-block fw-semibold">Food preference:</label> 
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="veg" name="food" value="veg"> 
                    <label class="form-check-label" for="veg">Vegetarian</label> 
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="nonveg" name="food" value="nonveg"> 
                    <label class="form-check-label" for="nonveg">Non-vegetarian</label> 
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label d-block fw-semibold">Interested in:</label> 
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="volunteer" name="interests" value="volunteer"> 
                    <label class="form-check-label" for="volunteer">Volunteering</label> 
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="perform" name="interests" value="perform"> 
                    <label class="form-check-label" for="perform">Performing</label> 
                  </div>
                </div>
              </fieldset> 

              <!-- Other -->
              <fieldset class="border rounded p-3 mb-4"> 
                <legend class="float-none w-auto px-2 h6 fw-bold text-primary">
                  <i class="fa-solid fa-ellipsis me-1"></i> Other Details
                </legend> 
                
                <div class="mb-3">
                  <label for="department" class="form-label">Department</label> 
                  <select id="department" name="department" class="form-select"> 
                    <option value="it">Information Technology</option> 
                    <option value="civil">Civil</option> 
                    <option value="electrical">Electrical</option> 
                  </select> 
                </div>

                <div class="mb-3">
                  <label for="remarks" class="form-label">Remarks</label> 
                  <textarea id="remarks" name="remarks" rows="4" class="form-control" placeholder="Any additional details..."></textarea> 
                </div>

                <div class="mb-3">
                  <label for="id_card" class="form-label">Student ID card (image)</label> 
                  <input type="file" id="id_card" name="id_card" class="form-control" accept="image/*,.pdf" required> 
                </div>
              </fieldset> 

              <!-- Action Buttons -->
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1 py-2">
                  <i class="fa-solid fa-paper-plane me-1"></i> Register
                </button> 
                <button type="reset" class="btn btn-outline-secondary py-2">
                  <i class="fa-solid fa-rotate-left me-1"></i> Clear
                </button> 
              </div>

            </form> 
          </div>
        </div>
      </div>
    </div>
  </main> 

  <footer> 
    <p class="mb-0">&copy; 2026 JNEC Events Hub</p> 
  </footer> 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
