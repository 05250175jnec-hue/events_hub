<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Register</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom CSS MUST stay last -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="fa-solid fa-graduation-cap text-primary me-2"></i>JNEC Events Hub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-4">
          <h2 class="card-title mb-4">Event Registration</h2>

          <form action="#" method="post" enctype="multipart/form-data">

            <!-- Full Name -->
            <div class="mb-3">
              <label for="fullname" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullname" name="fullname" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" name="phone">
            </div>

            <!-- Event ID -->
            <div class="mb-3">
              <label for="event_id" class="form-label">Select Event</label>
              <select class="form-select" id="event_id" name="event_id" required>
                <option value="">-- Choose an Event --</option>
                <option value="1">Tech Week Hackathon</option>
                <option value="2">Losar Cultural Night</option>
                <option value="3">Annual Sports Meet</option>
              </select>
            </div>

            <!-- Department -->
            <div class="mb-3">
              <label for="department" class="form-label">Department</label>
              <select class="form-select" id="department" name="department">
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics & Communication</option>
                <option value="CE">Civil Engineering</option>
                <option value="ME">Mechanical Engineering</option>
                <option value="EE">Electrical Engineering</option>
              </select>
            </div>

            <!-- Food Preference (Radio) -->
            <div class="mb-3">
              <label class="form-label d-block">Food Preference</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="food" id="veg" value="veg" checked>
                <label class="form-check-label" for="veg">Vegetarian</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="food" id="nonveg" value="nonveg">
                <label class="form-check-label" for="nonveg">Non-Vegetarian</label>
              </div>
            </div>

            <!-- Interests (Checkboxes) -->
            <div class="mb-3">
              <label class="form-label d-block">Interests</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="interests" id="coding" value="coding">
                <label class="form-check-label" for="coding">Coding</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="interests" id="gaming" value="gaming">
                <label class="form-check-label" for="gaming">Gaming</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="interests" id="design" value="design">
                <label class="form-check-label" for="design">Design</label>
              </div>
            </div>

            <!-- Remarks -->
            <div class="mb-3">
              <label for="remarks" class="form-label">Remarks / Special Requirements</label>
              <textarea class="form-control" id="remarks" name="remarks" rows="3"></textarea>
            </div>

            <!-- ID Card File Upload -->
            <div class="mb-4">
              <label for="id_card" class="form-label">Upload Student ID Card</label>
              <input class="form-control" type="file" id="id_card" name="id_card">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100">Submit Registration</button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 JNEC Events Hub</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
